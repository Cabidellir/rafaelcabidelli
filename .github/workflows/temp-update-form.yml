name: Temporary Formspree Endpoint Update

on:
  push:
    paths:
      - '.github/workflows/temp-update-form.yml'

permissions:
  contents: write

jobs:
  update-form:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Formspree endpoint and remove temporary workflow
        shell: bash
        run: |
          OLD='https://formspree.io/f/xpznqkjq'
          NEW='https://formspree.io/f/mqpavado'

          for file in index.html index_en.html; do
            if [ -f "$file" ]; then
              sed -i "s#${OLD}#${NEW}#g" "$file"
            fi
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -f .github/workflows/temp-update-form.yml

          git add index.html index_en.html .github/workflows/temp-update-form.yml
          git commit -m 'Fix Formspree contact form endpoint'
          git push
